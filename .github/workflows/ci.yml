name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build-only gate: proves the Dockerfile (and the baked-in
      # enigmata-xelatex.tex COPY) still builds before publish.yml ships it
      # from main. Shares the gha layer cache with publish.yml so a green PR
      # makes the main publish build fast.
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
