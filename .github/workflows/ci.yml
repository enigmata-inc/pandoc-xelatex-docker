name: CI

on:
  pull_request:
    branches: [main]

# We cancel a pull request's superseded run (a newer push to it started one) because it only spends Actions minutes; any other event gets its own group (its run id), so push, tag, schedule and dispatch runs are never queued, replaced or cancelled. Reopens if a pull-request run gains a side effect a cancel could cut short.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every workflow here declares its GITHUB_TOKEN permissions, never read-all or
      # write-all, with write only on the job that needs it and a reason beside each
      # write, writes no value someone else chose inside a script, and every job that
      # reads a secret is listed for it in .github/secret-readers.yml. The rules live
      # once in platform (the action's README says why each holds); the full-sha pin
      # makes a rule change a reviewed bump here.
      - name: Workflow token permissions
        uses: enigmata-inc/platform/.github/actions/workflow-permissions@3f15a692602a4d18dcc50b45544fb38758fac961 # workflow-permissions-v2.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build-only gate: proves the Dockerfile (and the baked-in
      # enigmata-xelatex.tex COPY) still builds before publish.yml ships it
      # from main. Shares the gha layer cache with publish.yml so a green PR
      # makes the main publish build fast.
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
